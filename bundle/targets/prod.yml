targets:
  prod:
    mode: production
    workspace:
      host: ${workspace.host}
    variables:
      dev_catalog: agentops_dev
      prod_catalog: agentops_prod
      model_serving_endpoint: agentops-prod-endpoint
      vector_search_endpoint: agentops-vs-prod-endpoint
      # Retrieval: hybrid + reranking for maximum precision in production
      query_type: hybrid
      enable_reranking: "true"
      reranker_candidates: "30"
      # AI Gateway: guardrails + rate limiting required in production
      enable_guardrails: "true"
      rate_limit_per_minute: "120"
      # Endpoint sizing: no cold starts, medium workload for prod traffic
      endpoint_workload_size: Medium
      endpoint_scale_to_zero: "false"
    run_as:
      user_name: ${workspace.current_user.userName}
