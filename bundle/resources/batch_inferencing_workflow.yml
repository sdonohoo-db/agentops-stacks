# Batch Inferencing Workflow
# ===========================
# Scheduled batch inference against the production Model Serving endpoint.
# Runs in the production workspace on the release branch.
#
# Use cases:
#   - Large-scale document processing pipelines
#   - Scheduled summarization or extraction jobs
#   - Offline evaluation over new production data
#
# Results are written to the Prod Catalog and traced in MLflow.

resources:
  jobs:
    batch_inferencing_workflow:
      name: "[AgentOps] Batch Inferencing"
      description: >
        Runs scheduled batch inference against the production Model Serving endpoint.
        Reads requests from the Prod Catalog, generates responses using the deployed
        agent, writes results back to Prod Catalog, and logs traces to MLflow.

      tags:
        agentops_component: batch_inferencing
        agentops_env: ${bundle.target}

      # Run daily at 2 AM UTC (production only)
      # Comment out schedule for dev/staging
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED  # Set to UNPAUSED in prod after validation

      job_clusters:
        - job_cluster_key: batch_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type_large}  # Larger for batch throughput
            num_workers: 4
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.sql.shuffle.partitions: "200"
            custom_tags:
              agentops_workflow: batch_inferencing

      tasks:
        - task_key: batch_inference
          description: Run batch inference against the production endpoint
          job_cluster_key: batch_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_batch_inferencing
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 14400  # 4 hours max for large batches

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
        on_success:
          - ${workspace.current_user.userName}
