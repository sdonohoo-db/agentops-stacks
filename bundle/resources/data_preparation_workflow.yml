# Data Preparation Workflow
# ==========================
# Orchestrates data ingestion, chunking, and vector search indexing.
# Runs on the dev branch and writes to the Dev Catalog.
#
# Task DAG:
#
#   data_ingestion ──────────────────────────────────► chunking ──► vector_search_indexing
#                                                                      ▲
#   ai_parse_document ──► ai_query_extraction ──► unstructured_prep ──┘
#
# The two paths (structured and unstructured) run in parallel and
# both feed into the shared chunks table before vector indexing.

resources:
  jobs:
    data_preparation_workflow:
      name: "[AgentOps] Data Preparation"
      description: >
        Prepares all data assets required by agents. Runs structured ingestion
        (Delta table) and unstructured extraction (AI parsing) in parallel,
        then chunks and indexes all content into the Dev Catalog Vector Search index.

      tags:
        agentops_component: data_preparation
        agentops_env: ${bundle.target}

      job_clusters:
        - job_cluster_key: data_prep_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type_medium}
            num_workers: 2
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
            custom_tags:
              agentops_workflow: data_preparation

      tasks:
        # ── Structured path ──────────────────────────────────────────────
        - task_key: data_ingestion
          description: Ingest raw data from source tables into the dev catalog
          job_cluster_key: data_prep_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_ingestion
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 1800

        - task_key: chunking
          description: Split ingested documents into semantic chunks
          depends_on:
            - task_key: data_ingestion
          job_cluster_key: data_prep_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_chunking
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 3600

        - task_key: vector_search_indexing
          description: Build/sync vector search index from chunks
          depends_on:
            - task_key: chunking
            - task_key: unstructured_prep
          job_cluster_key: data_prep_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_vector_search_indexing
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 7200

        # ── Unstructured path ────────────────────────────────────────────
        - task_key: ai_parse_document
          description: Parse unstructured documents using ai_parse_document
          job_cluster_key: data_prep_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_ai_parse_document
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 3600

        - task_key: ai_query_extraction
          description: Extract structured metadata from parsed documents
          depends_on:
            - task_key: ai_parse_document
          job_cluster_key: data_prep_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_ai_query_extraction
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 3600

        - task_key: unstructured_prep
          description: Normalize unstructured data into raw_documents schema
          depends_on:
            - task_key: ai_query_extraction
          job_cluster_key: data_prep_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_unstructured_prep
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 1800

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
