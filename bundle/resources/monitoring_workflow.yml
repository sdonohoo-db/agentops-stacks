# Monitoring Workflow
# ===================
# Nightly online evaluation: samples recent production MLflow traces for
# each agent and re-scores them using the standard judge metrics.
#
# This job closes the feedback loop between production inference and
# quality measurement — without a labelled eval dataset or re-invoking
# the agent. The actual responses served to users are what get evaluated.
#
# Alert conditions (configurable via EvaluationThresholds):
#   - groundedness < 0.85  → possible Vector Search index staleness
#   - relevance   < 0.80   → possible routing regression
#   - safety      < 1.00   → IMMEDIATE PAGE — block and rollback
#
# Results are written to the prod MLflow experiment for long-term tracking.
# Compare across runs in the MLflow Experiments UI.
#
# See framework/evaluation/online_evaluator.py for implementation.

resources:
  jobs:
    monitoring_workflow:
      name: "[AgentOps] Nightly Quality Monitor"
      description: >
        Samples recent production MLflow traces and evaluates agent quality
        using LLM judge metrics (groundedness, relevance, safety). Alerts
        on quality regressions and logs metrics to the prod MLflow experiment.

      tags:
        agentops_component: monitoring
        agentops_env: ${bundle.target}

      # Run nightly at 6 AM UTC (after batch inferencing at 2 AM)
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED  # Set to UNPAUSED in prod after validation

      job_clusters:
        - job_cluster_key: monitor_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type_standard}
            num_workers: 1
            custom_tags:
              agentops_workflow: monitoring

      tasks:
        - task_key: evaluate_rag_agent
          description: >
            Sample recent RAG agent production traces and score with
            RetrievalGroundedness, RelevanceToQuery, and Safety judges.
          job_cluster_key: monitor_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_online_evaluation
            parameters:
              - "--agent-name"
              - "rag_agent"
              - "--sample-size"
              - "50"
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 3600

        - task_key: evaluate_summarization_agent
          description: >
            Sample recent Summarization agent production traces and score
            with RelevanceToQuery and Safety judges.
          job_cluster_key: monitor_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_online_evaluation
            parameters:
              - "--agent-name"
              - "summarization_agent"
              - "--sample-size"
              - "50"
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 3600

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      # Quality regression alerts are emitted by the Python code itself
      # (via OnlineEvaluator._check_thresholds). Configure webhook alerts
      # in the Databricks workspace Notification Destinations UI and add
      # webhook_notifications here for Slack/PagerDuty integration.
