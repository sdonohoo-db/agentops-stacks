# Agent Development Workflow
# ===========================
# Orchestrates agent router development, tool registration, agent development,
# and automated evaluation for all agents.
#
# Task DAG:
#
#   agent_router_dev
#       ├── agent1_tools ──► agent1_dev ──► agent1_eval ──┐
#       └── agent2_tools ──► agent2_dev ──► agent2_eval ──┘
#                                                         └── (all pass → commit triggers CI)
#
# Best practice: Run agent1_eval and agent2_eval before every commit.
# Both must pass quality thresholds (see framework/evaluation/evaluator.py)
# before the developer promotes to staging.

resources:
  jobs:
    agent_development_workflow:
      name: "[AgentOps] Agent Development"
      description: >
        Develops and evaluates all agents in the multi-agent system. Registers
        tools and functions in Unity Catalog, builds agent logic, and runs
        automated evaluation against the eval dataset. All evaluation traces
        are logged to MLflow for inspection.

      tags:
        agentops_component: agent_development
        agentops_env: ${bundle.target}

      job_clusters:
        - job_cluster_key: agent_dev_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type_standard}
            num_workers: 1
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
            custom_tags:
              agentops_workflow: agent_development

      tasks:
        - task_key: agent_router_dev
          description: Develop the multi-agent router
          job_cluster_key: agent_dev_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_router_dev
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 900

        - task_key: agent1_tools
          description: Register Agent 1 tools and functions in Unity Catalog
          depends_on:
            - task_key: agent_router_dev
          job_cluster_key: agent_dev_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_agent1_tools
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 600

        - task_key: agent2_tools
          description: Register Agent 2 tools and functions in Unity Catalog
          depends_on:
            - task_key: agent_router_dev
          job_cluster_key: agent_dev_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_agent2_tools
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 600

        - task_key: agent1_dev
          description: Develop and configure Agent 1
          depends_on:
            - task_key: agent1_tools
          job_cluster_key: agent_dev_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_agent1_dev
            parameters:
              - "--query-type"
              - "${var.query_type}"
              - "--enable-reranking"
              - "${var.enable_reranking}"
              - "--reranker-candidates"
              - "${var.reranker_candidates}"
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 1800

        - task_key: agent2_dev
          description: Develop and configure Agent 2
          depends_on:
            - task_key: agent2_tools
          job_cluster_key: agent_dev_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_agent2_dev
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 1800

        - task_key: agent1_eval
          description: Run automated evaluation for Agent 1 — must pass before promotion
          depends_on:
            - task_key: agent1_dev
          job_cluster_key: agent_dev_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_agent1_eval
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 3600

        - task_key: agent2_eval
          description: Run automated evaluation for Agent 2 — must pass before promotion
          depends_on:
            - task_key: agent2_dev
          job_cluster_key: agent_dev_cluster
          python_wheel_task:
            package_name: agentops_framework
            entry_point: run_agent2_eval
          libraries:
            - whl: ./dist/agentops_framework-*.whl
          timeout_seconds: 3600

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
