[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agentops-framework"
version = "1.0.0"
description = "AgentOps Redux — Production-ready Databricks AgentOps framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    "mlflow>=2.17.0",
    "databricks-sdk>=0.30.0",
    "databricks-langchain>=0.3.0",
    "databricks-vectorsearch>=0.3.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas>=2.0",
]
mcp = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
# Data Preparation
run_ingestion               = "framework.entrypoints:run_ingestion"
run_chunking                = "framework.entrypoints:run_chunking"
run_vector_search_indexing  = "framework.entrypoints:run_vector_search_indexing"
run_ai_parse_document       = "framework.entrypoints:run_ai_parse_document"
run_ai_query_extraction     = "framework.entrypoints:run_ai_query_extraction"
run_unstructured_prep       = "framework.entrypoints:run_unstructured_prep"
# Agent Development
run_router_dev              = "framework.entrypoints:run_router_dev"
run_agent1_tools            = "framework.entrypoints:run_agent1_tools"
run_agent2_tools            = "framework.entrypoints:run_agent2_tools"
run_agent1_dev              = "framework.entrypoints:run_agent1_dev"
run_agent2_dev              = "framework.entrypoints:run_agent2_dev"
run_agent1_eval             = "framework.entrypoints:run_agent1_eval"
run_agent2_eval             = "framework.entrypoints:run_agent2_eval"
# App Deployment
run_agent1_deploy           = "framework.entrypoints:run_agent1_deploy"
run_agent2_deploy           = "framework.entrypoints:run_agent2_deploy"
run_app_deploy              = "framework.entrypoints:run_app_deploy"
# Batch Inferencing
run_batch_inferencing       = "framework.entrypoints:run_batch_inferencing"
# Monitoring
run_online_evaluation       = "framework.entrypoints:run_online_evaluation"

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*", "reference_agent*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
