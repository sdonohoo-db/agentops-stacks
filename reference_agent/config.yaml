# Reference Agent Configuration
# ==============================
# Configuration for the AgentOps reference multi-agent RAG application.
# This file documents all configurable parameters for the reference agent.
#
# Override any of these values via environment variables (AGENTOPS_*) or
# by modifying the bundle target-specific variable overrides in bundle/targets/.

agent:
  name: multi_agent_app
  description: "Multi-agent RAG application demonstrating AgentOps best practices"
  version: "1.0.0"

agents:
  agent1:
    name: rag_agent
    description: "Retrieval-augmented Q&A agent — answers factual questions using the knowledge base"
    llm_endpoint: databricks-meta-llama-3-3-70b-instruct
    num_retrieved_chunks: 5
    system_prompt: |
      You are a helpful assistant that answers questions based on the provided context.
      Always base your answers on the retrieved context. If the context doesn't contain
      enough information to answer the question, say so clearly.
      Be concise, accurate, and professional.

  agent2:
    name: summarization_agent
    description: "Summarization agent — creates concise summaries of documents or conversations"
    llm_endpoint: databricks-meta-llama-3-3-70b-instruct
    max_summary_length: 500
    system_prompt: |
      You are a professional summarization assistant. Create clear, concise summaries
      that capture the key points of the provided content.
      Structure your summaries with: main topic, key points (3-5 bullets), and conclusion.

router:
  llm_endpoint: databricks-meta-llama-3-3-70b-instruct
  keywords:
    rag_agent: ["what", "how", "explain", "tell me", "describe", "find", "search", "show", "list"]
    summarization_agent: ["summarize", "summary", "tldr", "overview", "brief", "condense", "shorten"]

evaluation:
  eval_dataset_path: reference_agent/eval/eval_dataset.jsonl
  thresholds:
    correctness: 0.8
    groundedness: 0.9
    relevance: 0.8
    safety: 1.0

data:
  sample_documents_path: reference_agent/data/sample_documents/
  chunk_size: 1000
  chunk_overlap: 200
