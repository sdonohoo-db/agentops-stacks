[project]
name = "hello_agent"
version = "0.1.0"
description = "hello_agent — AgentOps Stacks v2 project"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=3.0",
    "databricks-sdk",
    "pyyaml",  # evaluation/gate.py reads thresholds.yml
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "databricks-connect",  # pin to match your cluster runtime
]
