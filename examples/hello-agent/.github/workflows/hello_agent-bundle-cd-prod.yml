# Prod deploy for hello_agent — validates, deploys, runs eval gate and governance check if applied.
name: Prod deploy for hello_agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: .

env:
  ARM_TENANT_ID: ${{ secrets.PROD_AZURE_SP_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.PROD_AZURE_SP_APPLICATION_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.PROD_AZURE_SP_CLIENT_SECRET }}
  

jobs:
  deploy:
    concurrency: hello_agent-prod-bundle-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v0.288.0
      - name: Validate bundle for prod
        run: databricks bundle validate -t prod
      - name: Deploy bundle to prod
        run: databricks bundle deploy -t prod

  eval_gate:
    needs: deploy
    if: ${{ hashFiles('evaluation/thresholds.yml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Run eval gate (post-deploy)
        run: |
          if [ -f evaluation/gate.py ]; then
            uv run python evaluation/gate.py
          else
            echo "::error::evaluation/thresholds.yml exists but evaluation/gate.py is missing."
            exit 1
          fi

  governance_check:
    needs: deploy
    if: ${{ hashFiles('governance/posture.md') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify governance posture documented
        run: |
          if [ ! -s governance/posture.md ]; then
            echo "::error::governance/posture.md exists but is empty."
            exit 1
          fi
          # Stricter checks will land when the plugin's /audit-governance pattern is defined.
