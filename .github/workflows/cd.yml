name: AgentOps CD — Continuous Deployment

# Triggers on push to release branch.
# Deploys AgentOps to production workspace and generates/commits manifest.

on:
  push:
    branches: [release]

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval in GitHub Environments

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Install Python dependencies
        run: pip install -e "."

      - name: Build wheel
        run: |
          pip install build
          python -m build

      - name: Validate bundle (prod target)
        run: databricks bundle validate --target prod

      - name: Deploy to production
        run: databricks bundle deploy --target prod

      - name: Generate deployment manifest
        run: python scripts/generate_manifest.py --target prod
        env:
          AGENTOPS_ENV: prod

      - name: Verify deployment
        run: python scripts/verify.py --target prod --test-inference
        env:
          AGENTOPS_ENV: prod
        continue-on-error: true  # Don't block on verify failure; report it

      - name: Commit deployment manifest
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add deployment_manifest.md verification_report.md
          git diff --staged --quiet || git commit -m "chore: update deployment manifest [skip ci]"
          git push

      - name: Create deployment summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Workspace | ${{ secrets.DATABRICKS_PROD_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See \`deployment_manifest.md\` and \`verification_report.md\` for details." >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Production deployment failed — ${context.sha.substring(0, 7)}`,
              body: `The production deployment triggered by commit ${context.sha} failed.\n\nSee the [failed workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\nManual intervention required.`,
              labels: ['deployment', 'production', 'urgent'],
            });
